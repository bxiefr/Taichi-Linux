---
# Taichi Linux - Calamares ana ayar dosyası
modules-search: [ local ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf
  - id: efivars
    module: shellprocess
    config: shellprocess_efivars.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - luksopenswaphookcfg
      - shellprocess@cleanup
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@efivars
      - bootloader
      - umount
  - show:
      - finished

branding: taichi

prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
