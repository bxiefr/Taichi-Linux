---
# Kurulu sisteme kopyalanan canlı ISO artıklarını temizler ve çekirdeği hazırlar.
# Hedef sistemin içinde (chroot) çalışır. unpackfs'ten SONRA, initcpio'dan ÖNCE.
dontChroot: false
timeout: 300

script:
  # --- canlı oturum artıkları ---
  - "rm -f /etc/sddm.conf.d/10-taichi-live.conf"
  - "rm -f /etc/systemd/system/taichi-live-setup.service /etc/systemd/system/multi-user.target.wants/taichi-live-setup.service"
  - "rm -f /usr/local/bin/taichi-live-setup /etc/sudoers.d/10-live"
  - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "rm -f /etc/ssh/sshd_config.d/10-archiso.conf"
  - "rm -f /root/.zlogin /root/.automated_script.sh"
  - "rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/multi-user.target.wants/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "rm -f /etc/polkit-1/rules.d/49-taichi-live.rules"
  - "rm -f /etc/skel/Desktop/install-taichi.desktop /usr/local/bin/taichi-installer /usr/share/applications/taichi-installer.desktop"

  - "cp -f /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux"

  # --- yönetici hakkı: şifreli sudo (canlıdaki şifresiz kural kaldırıldı) ---
  - "echo '%wheel ALL=(ALL:ALL) ALL' > /etc/sudoers.d/10-wheel && chmod 440 /etc/sudoers.d/10-wheel"

  # --- archiso'ya özel initramfs ayarlarını normale çevir ---
  - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "printf '%s\\n' 'ALL_config=\"/etc/mkinitcpio.conf\"' 'ALL_kver=\"/boot/vmlinuz-linux\"' \"PRESETS=('default' 'fallback')\" 'default_image=\"/boot/initramfs-linux.img\"' 'fallback_image=\"/boot/initramfs-linux-fallback.img\"' 'fallback_options=\"-S autodetect\"' > /etc/mkinitcpio.d/linux.preset"

  # --- çekirdeği /boot'a yerleştir ---
  - "cp -f /usr/lib/modules/$(ls /usr/lib/modules | head -n1)/vmlinuz /boot/vmlinuz-linux"

  # --- GRUB menüsünde dağıtım adı ---
  - "sed -i 's/^GRUB_DISTRIBUTOR=.*/GRUB_DISTRIBUTOR=\"Taichi\"/' /etc/default/grub"

  # --- pacman anahtarlığını kurulu sistemde başlat ---
  - "pacman-key --init || echo 'UYARI: pacman-key --init basarisiz'"
  - "pacman-key --populate archlinux || echo 'UYARI: pacman-key --populate basarisiz'"
