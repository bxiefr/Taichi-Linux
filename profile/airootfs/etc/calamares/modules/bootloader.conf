---
# GRUB hem UEFI hem eski BIOS için kullanılır (Calamares ortamı kendisi algılar).
# GRUB, çekirdekleri kendisi bulur (grub-mkconfig): linux-cachyos ve yedek olarak linux.
efiBootLoader: "grub"
kernel: "/vmlinuz-linux-cachyos"
img: "/initramfs-linux-cachyos.img"
fallback: "/initramfs-linux-cachyos-fallback.img"
timeout: 5

grubInstall: "/usr/local/bin/taichi-grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootloaderId: "Taichi"
installEFIFallback: true
