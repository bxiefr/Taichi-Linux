---
# UEFI kurulumunda EFI değişkenlerini (efivarfs) hedef sisteme bağlamayı dener.
# Hata verirse kurulumu durdurmaz; grub-install sarmalayıcısı yedek yolu kullanır.
dontChroot: true
timeout: 30

script:
  - "mountpoint -q @@ROOT@@/sys/firmware/efi/efivars || mount -t efivarfs efivarfs @@ROOT@@/sys/firmware/efi/efivars || echo 'UYARI: efivarfs baglanamadi'"
