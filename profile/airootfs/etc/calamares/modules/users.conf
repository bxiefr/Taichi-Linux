---
defaultGroups:
  - users
  - wheel
  - audio
  - video
  - storage
  - optical
  - network
  - lp
  - input
autologinGroup: autologin
doAutologin: false
sudoersGroup: wheel
setRootPassword: false
doReusePassword: true
availableShells: /bin/bash
userShell: /bin/bash
allowWeakPasswords: true
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 1
  maxLength: -1
